name: ai_hallucination_detection_system

services:
  # ── PostgreSQL (with pgvector) ──────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: detection_admin
      POSTGRES_PASSWORD: detection_pass
      POSTGRES_DB: ai_detection
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U detection_admin -d ai_detection"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (FastAPI + CUDA) ────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - "6655:6655"
    depends_on:
      postgres:
        condition: service_healthy
    # CPU/API 推理模式：不需要 GPU（已移除 deploy.gpus 保留段）
    environment:
      # Override DB URLs to use Docker service names
      DATABASE_URL: "postgresql+asyncpg://detection_admin:detection_pass@postgres:5432/ai_detection"
      DATABASE_URL_SYNC: "postgresql://detection_admin:detection_pass@postgres:5432/ai_detection"
      WEB_SEARCH_ENABLED: "True"
      PORT: "6655"
      HOST: "0.0.0.0"
      TRUTHLENS_API_KEY: "${TRUTHLENS_API_KEY:-}"
      API_KEY_REQUIRED: "${API_KEY_REQUIRED:-False}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6655/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
